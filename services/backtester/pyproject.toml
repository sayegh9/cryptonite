[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptonite-backtester-service"
version = "0.1.0"
description = "Backtest execution worker daemon with two-phase lease claims and crash recovery"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.9.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "cryptonite-schemas",
    "cryptonite-storage",
    "cryptonite-strategies",
    "cryptonite-backtester",
]

[tool.hatch.build.targets.wheel]
packages = ["cryptonite_backtester_service"]
