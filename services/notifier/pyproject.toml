[project]
name = "cryptonite-notifier"
version = "0.1.0"
description = "Telegram (long polling) and ntfy notifier: approvals, Critical alerts, digests"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "pydantic>=2.9.0",
    "cryptonite-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cryptonite_notifier"]
