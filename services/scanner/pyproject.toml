[project]
name = "cryptonite-scanner-service"
version = "0.1.0"
description = "Runnable scanner worker daemon evaluating closed bars and scan jobs"
requires-python = ">=3.12,<3.15"
dependencies = [
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "polars>=1.12.0",
    "duckdb>=1.1.0",
    "pydantic>=2.9.0",
    "cryptonite-schemas",
    "cryptonite-storage",
    "cryptonite-scanner",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
