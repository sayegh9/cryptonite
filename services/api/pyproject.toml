[project]
name = "cryptonite-api"
version = "0.1.0"
description = "FastAPI & WebSocket stream gateway for Cryptonite"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "duckdb>=1.1.0",
    "polars>=1.12.0",
    "pydantic>=2.9.0",
    "cryptonite-schemas",
    "cryptonite-storage",
    "cryptonite-scanner",
    "cryptonite-strategies",
    "cryptonite-backtester",
    "cryptonite-execution",
    "cryptonite-agents",
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
