[project]
name = "cryptonite-orchestrator"
version = "0.1.0"
description = "Background daemon for autonomous live strategy execution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "pydantic>=2.9.0",
    "cryptonite-schemas",
    "cryptonite-storage",
    "cryptonite-execution",
    "cryptonite-strategies",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
