# Every container logs to json-file with rotation (F-M10): at most 5 x 50 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# Healthcheck timing shared by every long-running service; each sets its own `test` (F-M10). The
# timeout is generous because a loaded host (load avg ~28 with the scanner busy) stalls the API's
# /health for 4+ s now and then; three misses in a row are needed before a service turns unhealthy.
x-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cryptonite
      POSTGRES_PASSWORD: cryptonite_dev_pass
      POSTGRES_DB: cryptonite
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptonite -d cryptonite"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default
      - agents_net
      - isolated_backtester_net
    logging: *default-logging

  redis:
    # Consolidated Redis instance:
    # - DB 0: Market data telemetry, event bus, order signals, outbox, scanner, backtester
    # - DB 1: AI Agent worker session cache and conversational memory (consolidated from cryptonite_redis_agents)
    image: redis:7-alpine
    container_name: cryptonite_redis
    # LE-4: password from .env (REDIS_PASSWORD); every client URL below carries it
    # Repairs an AOF damaged by a host crash before starting (infra/redis/redis-selfheal.sh)
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-selfheal.sh"]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_dev_pass}"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
      - ./redis/redis-selfheal.sh:/usr/local/bin/redis-selfheal.sh:ro
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_pass}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      default: {}
      isolated_backtester_net: {}
      agents_net:
        aliases:
          - redis-agents
    logging: *default-logging

  ingest:
    restart: unless-stopped  # come back after a host reboot like every other long-running service
    build:
      context: ..
      dockerfile: infra/docker/ingest.Dockerfile
    container_name: cryptonite_ingest
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://cryptonite:cryptonite_dev_pass@postgres:5432/cryptonite
      ASYNC_DATABASE_URL: postgresql+asyncpg://cryptonite:cryptonite_dev_pass@postgres:5432/cryptonite
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      NAUTILUS_CATALOG_PATH: /app/data/nautilus_catalog
      ANALYTICS_LAKE_PATH: /app/data/analytics_lake
      INGEST_SYMBOLS: BTCUSDT,ETHUSDT,XRPUSDT,WLDUSDT
      INGEST_PERP_SYMBOLS: BTCUSDT,ETHUSDT  # futures bookTicker quotes -> <SYM>-PERP.BINANCE (perp order checks/fills)
      # Coalesce spot quotes too: unthrottled BTC spot (~160/s x 3 Redis writes) starved the ingest event loop
      INGEST_SPOT_QUOTE_HZ: "50"
      INGEST_TIMEFRAMES: 1m,15m,1h,4h
      PORT: 8080
    volumes:
      - ../data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  outbox:
    build:
      context: ..
      dockerfile: infra/docker/outbox.Dockerfile
    container_name: cryptonite_outbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://cryptonite:cryptonite_dev_pass@postgres:5432/cryptonite
      ASYNC_DATABASE_URL: postgresql+asyncpg://cryptonite:cryptonite_dev_pass@postgres:5432/cryptonite
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      PORT: 8081
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped
    healthcheck:  # GET /health (liveness)
      <<: *default-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=8)"]
    logging: *default-logging

  scanner:
    build:
      context: ..
      dockerfile: infra/docker/scanner.Dockerfile
    container_name: cryptonite_scanner
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://cryptonite:cryptonite_dev_pass@postgres:5432/cryptonite
      ASYNC_DATABASE_URL: postgresql+asyncpg://cryptonite:cryptonite_dev_pass@postgres:5432/cryptonite
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      ANALYTICS_LAKE_PATH: /app/data/analytics_lake
      PORT: 8082
    volumes:
      - ../data:/app/data:rw
      - ../services/api:/app/services/api
      - ../packages/agents:/app/packages/agents
    ports:
      - "127.0.0.1:8082:8082"
    restart: unless-stopped
    healthcheck:  # GET /health (liveness); its busy event loop answers in 1.3-4.5 s at load ~26, so more headroom
      <<: *default-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=20)"]
      timeout: 25s
    logging: *default-logging

  derivatives_feed:
    # Binance USD-M mark price / funding / open interest -> Redis perp:mark:*, perp:oi:*,
    # channel:perp_mark_ticks; funding settlements -> Postgres funding_rates (migration 020).
    # Needs outbound internet (default network).
    build:
      context: ..
      dockerfile: infra/docker/scanner.Dockerfile
    container_name: cryptonite_derivatives_feed
    command: ["python", "-m", "cryptonite_scanner_service.derivatives_feed"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No env_file: public market data only, so the .env secrets (exchange/LLM keys) stay out
    environment:
      DATABASE_URL: postgresql://cryptonite:cryptonite_dev_pass@postgres:5432/cryptonite
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      PERP_SYMBOLS: BTCUSDT,ETHUSDT
    restart: unless-stopped
    healthcheck:  # process liveness, not Binance reachability: its event loop rewrites this key every 30 s (90 s TTL)
      <<: *default-healthcheck
      test: ["CMD", "python", "-c", "import os,sys,redis; sys.exit(0 if redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=8).exists('derivatives_feed:heartbeat') else 1)"]
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: cryptonite_api
    networks:
      - default
      - agents_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    extra_hosts:  # local tier (Ollama) on the host: bind it to the docker bridge or Tailscale, never 0.0.0.0 (invariant 8)
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      DATABASE_URL: postgresql://cryptonite:cryptonite_dev_pass@postgres:5432/cryptonite
      ASYNC_DATABASE_URL: postgresql+asyncpg://cryptonite:cryptonite_dev_pass@postgres:5432/cryptonite
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      ANALYTICS_LAKE_PATH: /app/data/analytics_lake
      PORT: 8000
    volumes:
      - ../data:/app/data:rw
      - ../services/api:/app/services/api
      - ../packages/agents:/app/packages/agents
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:  # GET /health (liveness)
      <<: *default-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8)"]
    logging: *default-logging

  # Web UI (A4, F-M1): production Next.js (`next start`), supervised like every other service so :3000
  # answers after a reboot with no manual step. Its server-side proxies reach the API as api:8000; the
  # browser's WebSocket still goes to the published 127.0.0.1:8000. No env_file: it needs no secrets.
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_ORIGIN: http://api:8000
    container_name: cryptonite_web
    init: true  # Next as PID 1 would not reap children or forward signals cleanly
    cap_drop: [ALL]  # uid 1000 serving an unprivileged port needs no capabilities
    security_opt:
      - no-new-privileges:true
    environment:
      API_ORIGIN: http://api:8000
      API_BASE: http://api:8000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
    restart: unless-stopped
    logging: *default-logging

  backtester:
    build:
      context: ..
      dockerfile: infra/docker/backtester.Dockerfile
    container_name: cryptonite_backtester
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://cryptonite_backtester:backtester_dev_pass@postgres:5432/cryptonite
      ASYNC_DATABASE_URL: postgresql+asyncpg://cryptonite_backtester:backtester_dev_pass@postgres:5432/cryptonite
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      NAUTILUS_CATALOG_PATH: /app/data/nautilus_catalog
      ANALYTICS_LAKE_PATH: /app/data/analytics_lake
      BACKTEST_ARTIFACTS_PATH: /app/data/backtest_artifacts
      PORT: 8083
    volumes:
      - ../data/nautilus_catalog:/app/data/nautilus_catalog:ro
      - ../data/analytics_lake:/app/data/analytics_lake:ro
      - ../data/backtest_artifacts:/app/data/backtest_artifacts
      - sandbox_jobs:/app/data/sandbox_jobs
    ports:
      - "127.0.0.1:8083:8083"
    networks:
      - isolated_backtester_net
    restart: unless-stopped
    healthcheck:  # GET /health (liveness)
      <<: *default-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=8)"]
    logging: *default-logging

  # Runs model-written strategy code (blueprint Phase 4, ADR 0003). This container is the security
  # boundary: no network, no env file or secrets, read-only root, own PID namespace, process/memory/CPU
  # caps. The server (root with only SETUID/SETGID/CHOWN/KILL, group 1000 to share the jobs volume with
  # the backtester) runs each job's model code as uid 1001 in a private /tmp scratch dir: that uid
  # cannot reach the jobs volume, signal or ptrace the server, or see other jobs.
  strategy_sandbox:
    build:
      context: ..
      dockerfile: infra/docker/backtester.Dockerfile
    container_name: cryptonite_strategy_sandbox
    command: ["python", "-m", "cryptonite_backtester.sandbox", "serve",
              "--jobs", "/app/data/sandbox_jobs", "--catalog", "/app/data/nautilus_catalog",
              "--work", "/tmp", "--child-uid", "1001", "--scrub", "/dev/shm",
              "--heartbeat", "/tmp/.sandbox-alive"]
    environment:
      CRYPTONITE_STRATEGY_SANDBOX: "1"
      CRYPTONITE_SANDBOX_KILL_ALL: "1"  # after each job, kill every process but the server
    init: true  # reaps orphans; the server must not be PID 1 for kill(-1)
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=0755,uid=0,gid=0  # only the server creates the per-job scratch dirs
    volumes:
      - ../data/nautilus_catalog:/app/data/nautilus_catalog:ro
      - sandbox_jobs:/app/data/sandbox_jobs
    user: "0:1000"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 8g
    cpus: 2
    restart: unless-stopped
    healthcheck:  # no network, no HTTP: the serve loop touches --heartbeat every pass and every 10 s during a job
      <<: *default-healthcheck
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.stat('/tmp/.sandbox-alive').st_mtime < 60 else 1)"]
    logging: *default-logging

  orchestrator:
    build:
      context: ..
      dockerfile: infra/docker/orchestrator.Dockerfile
    container_name: cryptonite_orchestrator
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      derivatives_feed:
        condition: service_started  # perp mark prices; without them perp orders reject NO_MARK_PRICE
    env_file:
      - ../.env
    environment:
      - ENVIRONMENT=PAPER
      - ACCOUNT_ID=PAPER-ACCOUNT-001
      - DATABASE_URL=postgresql://cryptonite:cryptonite_dev_pass@postgres:5432/cryptonite
      - ASYNC_DATABASE_URL=postgresql+asyncpg://cryptonite:cryptonite_dev_pass@postgres:5432/cryptonite
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      - ANALYTICS_LAKE_PATH=/app/data/analytics_lake  # F4 betas (1h bars); without it beta falls back to 1.0
    volumes:
      - ../services/orchestrator:/app/services/orchestrator
      - ../packages/execution:/app/packages/execution
      - ../packages/strategies:/app/packages/strategies
      - ../data/analytics_lake:/app/data/analytics_lake:ro
    restart: unless-stopped
    healthcheck:  # no HTTP server: ops_monitor republishes risk:effective_limits every 60 s (180 s TTL)
      <<: *default-healthcheck
      test: ["CMD", "python", "-c", "import os,sys,redis; sys.exit(0 if redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=8).exists('risk:effective_limits') else 1)"]
      start_period: 120s
    logging: *default-logging

  # Binance Demo venue executor: opt-in (`--profile binance_demo`). The paper stack does not use it, and it
  # needs a real ed25519 key in infra/security/binance_demo_private_key.pem (the repo ships an empty one).
  executor:
    build:
      context: ..
      dockerfile: infra/docker/executor.Dockerfile
    container_name: cryptonite_executor
    profiles: ["binance_demo"]
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://cryptonite:cryptonite_dev_pass@postgres:5432/cryptonite
      ASYNC_DATABASE_URL: postgresql+asyncpg://cryptonite:cryptonite_dev_pass@postgres:5432/cryptonite
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      NAUTILUS_CATALOG_PATH: /app/data/nautilus_catalog
      PORT: 8084
      ENVIRONMENT: DEMO
      # The real Binance demo venue by default; the in-memory simulator only when explicitly asked for
      # (USE_MOCK_VENUE=true), because simulated fills must never read as real ones.
      USE_MOCK_VENUE: "${USE_MOCK_VENUE:-false}"
      ACCOUNT_ID: DEMO-ACCOUNT-001
      BINANCE_DEMO_BASE_URL: https://demo-api.binance.com
      BINANCE_DEMO_WS_URL: wss://demo-ws-api.binance.com/ws-api/v3
      BINANCE_FUTURES_DEMO_BASE_URL: https://testnet.binancefuture.com
      BINANCE_DEMO_API_KEY: ${BINANCE_DEMO_API_KEY:-}
      BINANCE_DEMO_PRIVATE_KEY_PATH: /run/secrets/binance_demo_private_key.pem
      EMERGENCY_MARKER_PATH: /data/executor_state/demo/emergency_kill_switch.marker
    volumes:
      - ../data:/data
      - ../services/executor:/app/services/executor
      - ../packages/execution:/app/packages/execution
    secrets:
      - binance_demo_private_key.pem
    ports:
      - "127.0.0.1:8084:8084"
    restart: unless-stopped
    healthcheck:  # GET /health (liveness)
      <<: *default-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/health', timeout=8)"]
    logging: *default-logging

  agent_worker:
    build:
      context: ..
      dockerfile: infra/docker/agent_worker.Dockerfile
    container_name: cryptonite_agent_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:  # local tier (Ollama) on the host: bind it to the docker bridge or Tailscale, never 0.0.0.0 (invariant 8)
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      DATABASE_URL: postgresql://cryptonite_agent_ro:agent_ro_dev_pass@postgres:5432/cryptonite
      ASYNC_DATABASE_URL: postgresql+asyncpg://cryptonite_agent_ro:agent_ro_dev_pass@postgres:5432/cryptonite
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/1
      AGENT_TOOLS_DATABASE_URL: postgresql://cryptonite_agent_ro:agent_ro_dev_pass@postgres:5432/cryptonite
      AI_TELEMETRY_DATABASE_URL: postgresql://cryptonite_ai_telemetry:ai_telemetry_dev_pass@postgres:5432/cryptonite
      NAUTILUS_CATALOG_PATH: /app/data/nautilus_catalog
      PORT: 8085
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data:rw
      - ../services/api:/app/services/api
      - ../packages/agents:/app/packages/agents
    ports:
      - "127.0.0.1:8085:8085"
    restart: unless-stopped
    healthcheck:  # GET /health (liveness; exempt from the HMAC check)
      <<: *default-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=8)"]
    logging: *default-logging
  debate_worker:
    restart: unless-stopped  # come back after a host reboot like every other long-running service
    build:
      context: ..
      dockerfile: infra/docker/debate_worker.Dockerfile
    deploy:
      replicas: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:  # local tier (Ollama) on the host: bind it to the docker bridge or Tailscale, never 0.0.0.0 (invariant 8)
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      DATABASE_URL: postgresql://cryptonite_api:api_dev_pass@postgres:5432/cryptonite
      ASYNC_DATABASE_URL: postgresql+asyncpg://cryptonite_api:api_dev_pass@postgres:5432/cryptonite
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      AGENT_TOOLS_DATABASE_URL: postgresql://cryptonite_agent_ro:agent_ro_dev_pass@postgres:5432/cryptonite
      AI_TELEMETRY_DATABASE_URL: postgresql://cryptonite_ai_telemetry:ai_telemetry_dev_pass@postgres:5432/cryptonite
      NAUTILUS_CATALOG_PATH: /app/data/nautilus_catalog
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data:rw
    healthcheck:  # no HTTP server or stored heartbeat: Redis reachable with the worker's own URL
      <<: *default-healthcheck
      test: ["CMD", "python", "-c", "import os,redis; redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=8).ping()"]
    logging: *default-logging

  research_worker:
    # Overnight strategy research (blueprint Phase 4): works off research:queue. Opt-in:
    # start with --profile research. Needs CRYPTONITE_AGENT_API_TOKEN (operator-scoped machine
    # token) in .env; backtests run in the backtester's sandbox, reports land in data/research_reports.
    build:
      context: ..
      dockerfile: infra/docker/agent_worker.Dockerfile
    profiles: ["research"]
    command: ["python", "-m", "cryptonite_agents.research", "worker"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    extra_hosts:  # local tier (Ollama) on the host: bind it to the docker bridge or Tailscale, never 0.0.0.0 (invariant 8)
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      AGENT_TOOLS_DATABASE_URL: postgresql://cryptonite_agent_ro:agent_ro_dev_pass@postgres:5432/cryptonite
      AI_TELEMETRY_DATABASE_URL: postgresql://cryptonite_ai_telemetry:ai_telemetry_dev_pass@postgres:5432/cryptonite
      RESEARCH_REPORTS_PATH: /app/data/research_reports
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data:rw
      - ../packages/agents:/app/packages/agents
    healthcheck:  # no HTTP server or stored heartbeat: Redis reachable with the worker's own URL
      <<: *default-healthcheck
      test: ["CMD", "python", "-c", "import os,redis; redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=8).ping()"]
    logging: *default-logging

  exit_monitor:
    restart: unless-stopped  # come back after a host reboot like every other long-running service
    build:
      context: ..
      dockerfile: infra/docker/scanner.Dockerfile
    # Deterministic exits (stops on AI-owned positions) + event-triggered exit debates.
    # Opt-in: start with --profile monitoring. See docs/adr/0002-debate-cost-controls.md.
    profiles: ["monitoring"]
    command: ["python", "-m", "cryptonite_scanner_service.exit_monitor"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cryptonite_api:api_dev_pass@postgres:5432/cryptonite
      ASYNC_DATABASE_URL: postgresql+asyncpg://cryptonite_api:api_dev_pass@postgres:5432/cryptonite
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data:rw
      - ../services/scanner:/app/services/scanner
    healthcheck:  # exit_monitor:heartbeat expires when its loop stops
      <<: *default-healthcheck
      test: ["CMD", "python", "-c", "import os,sys,redis; sys.exit(0 if redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=8).exists('exit_monitor:heartbeat') else 1)"]
      start_period: 120s
    logging: *default-logging

  notifier:
    build:
      context: ..
      dockerfile: infra/docker/notifier.Dockerfile
    # Telegram approvals (long polling: outbound only, no port) + ntfy for Critical alerts (A5.4).
    # Opt-in: docker compose --profile notifier up -d notifier. Its own env file ../.env.notifier (not
    # the shared .env: it needs none of the exchange/LLM/TOTP secrets): TELEGRAM_BOT_TOKEN,
    # TELEGRAM_ALLOWED_CHAT_IDS, NOTIFIER_HMAC_SECRET (same value as in .env for api), NTFY_TOPIC.
    profiles: ["notifier"]
    command: ["python", "-m", "cryptonite_notifier"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://cryptonite_notifier:notifier_dev_pass@postgres:5432/cryptonite
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      CRYPTONITE_API_URL: http://api:8000
    env_file:
      - ../.env.notifier
    restart: unless-stopped
    healthcheck:  # notifier:heartbeat is rewritten every 30 s (90 s TTL)
      <<: *default-healthcheck
      test: ["CMD", "python", "-c", "import os,sys,redis; sys.exit(0 if redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=8).exists('notifier:heartbeat') else 1)"]
    logging: *default-logging

  # Learner (A7.1): labels decision outcomes at fixed horizons and writes reflections from them.
  # Exactly one instance (the debate worker has replicas); reads the lake, never writes data/.
  learner:
    build:
      context: ..
      dockerfile: infra/docker/debate_worker.Dockerfile
    container_name: cryptonite_learner
    command: ["python", "services/debate_worker/learner.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:  # local tier (Ollama) on the host: bind it to the docker bridge or Tailscale, never 0.0.0.0 (invariant 8)
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      DATABASE_URL: postgresql://cryptonite_api:api_dev_pass@postgres:5432/cryptonite
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
      AI_TELEMETRY_DATABASE_URL: postgresql://cryptonite_ai_telemetry:ai_telemetry_dev_pass@postgres:5432/cryptonite
      ANALYTICS_LAKE_PATH: /app/data/analytics_lake
      LEARNER_INTERVAL_S: "300"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data:ro
    restart: unless-stopped
    healthcheck:  # learner:heartbeat is written after each pass (3 x LEARNER_INTERVAL_S TTL); the first pass is slow
      <<: *default-healthcheck
      test: ["CMD", "python", "-c", "import os,sys,redis; sys.exit(0 if redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=8).exists('learner:heartbeat') else 1)"]
      start_period: 600s
    logging: *default-logging

  # Sentiment (A6.3): CryptoBERT + FinBERT on CPU, internal network only, no secrets, no host port.
  # Weights live outside the repo (default ~/models/hf), mounted read-only.
  sentiment:
    build:
      context: ..
      dockerfile: infra/docker/sentiment.Dockerfile
    container_name: cryptonite_sentiment
    volumes:
      - ${SENTIMENT_MODELS_DIR:-${HOME}/models/hf}:/models:ro
    environment:
      SENTIMENT_THREADS: "8"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=8))['ok'] else 1)"]
    restart: unless-stopped
    logging: *default-logging

  # Fresh named volumes mount root-owned; hand them to the image's uid 1000 once per run.
  test_volumes_init:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    profiles: ["test"]
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/tmp/.uv-cache", "/tmp/.venv"]
    volumes:
      - test_uv_cache:/tmp/.uv-cache
      - test_venv:/tmp/.venv
    logging: *default-logging

  # Test runner: `docker compose -f infra/docker-compose.yml run --rm test uv run pytest tests -q`
  # Opt-in via profile so `up -d` never starts it. Whole repo is mounted; uv cache
  # and venv persist in named volumes so repeat runs skip the dependency download.
  test:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    profiles: ["test"]
    working_dir: /workspace
    entrypoint: ["sh", "-c", "uv sync --frozen --extra dev --all-packages --quiet && exec \"$$@\"", "--"]
    command: ["uv", "run", "pytest", "tests", "-q"]
    depends_on:
      test_volumes_init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      UV_CACHE_DIR: /tmp/.uv-cache
      UV_PROJECT_ENVIRONMENT: /tmp/.venv
      UV_FROZEN: "1"
      UV_PYTHON_DOWNLOADS: never
      PYTHONDONTWRITEBYTECODE: "1"
      CRYPTONITE_ENV: test  # allows the all-zero dev TOTP key (R7.10)
      # The dev DB, for operator scripts run in this container. pytest refuses it (tests/conftest.py, C3):
      # pass -e DATABASE_URL=... for a throwaway cryptonite_ci_<item> DB, as in HANDOFF.md.
      DATABASE_URL: postgresql://cryptonite:cryptonite_dev_pass@postgres:5432/cryptonite
      ASYNC_DATABASE_URL: postgresql+asyncpg://cryptonite:cryptonite_dev_pass@postgres:5432/cryptonite
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pass}@redis:6379/0
    volumes:
      - ..:/workspace
      - test_uv_cache:/tmp/.uv-cache
      - test_venv:/tmp/.venv
    logging: *default-logging

volumes:
  sandbox_jobs:  # size-capped tmpfs: the sandbox cannot fill the host disk
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4g,uid=1000,gid=1000,mode=0770
  postgres_data:
  redis_data:
  test_uv_cache:
  test_venv:

secrets:
  binance_demo_private_key.pem:
    file: ../infra/security/binance_demo_private_key.pem

networks:
  agents_net:
    driver: bridge
  isolated_backtester_net:
    driver: bridge
    internal: true
  default:

