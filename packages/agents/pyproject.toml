[project]
name = "cryptonite-agents"
version = "0.1.0"
description = "Antigravity agents for Cryptonite"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.9.0",
    "google-antigravity>=0.1.16",
    "duckdb>=1.1.0",
    "sqlalchemy>=2.0.0",
    "cryptonite-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
