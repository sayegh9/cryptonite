[project]
name = "cryptonite-agents"
version = "0.1.0"
description = "AI agents, gateway, and evals for Cryptonite"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-ai-slim[google,openai]>=2.50.0",
    "duckdb>=1.1.0",
    "sqlalchemy>=2.0.0",
    "cryptonite-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
