[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptonite-storage"
version = "0.1.0"
description = "Storage engine: Nautilus ParquetDataCatalog wrapper, enriched analytics lake, DuckDB query engine, and two-store coordinator"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cryptonite-schemas",
    "nautilus-trader==2.0.0rc4",
    "pyarrow>=18.0.0",
    "duckdb>=1.1.0",
    "polars>=1.12.0",
    "asyncpg>=0.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cryptonite_storage"]
