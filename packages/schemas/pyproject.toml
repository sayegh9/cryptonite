[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptonite-schemas"
version = "0.1.0"
description = "Domain models, schemas, and abstract data source interfaces for Cryptonite"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.9.0",
    "pyarrow>=18.0.0",
    "nautilus-trader==2.0.0rc4",
]

[tool.hatch.build.targets.wheel]
packages = ["cryptonite_schemas"]
