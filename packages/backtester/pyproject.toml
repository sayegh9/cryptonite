[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptonite-backtester"
version = "0.1.0"
description = "Canonical backtesting runner, metrics calculation, and artifact persistence"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.9.0",
    "pyarrow>=18.0.0",
    "duckdb>=1.1.0",
    "polars>=1.12.0",
    "nautilus-trader==2.0.0rc4",
    "cryptonite-schemas",
    "cryptonite-storage",
    "cryptonite-strategies",
]

[tool.hatch.build.targets.wheel]
packages = ["cryptonite_backtester"]
