[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptonite-execution"
version = "0.1.0"
description = "Paper trading engine, synchronous risk guardrails, gate-owned router, and event bridge"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.9.0",
    "pyarrow>=18.0.0",
    "nautilus-trader==2.0.0rc4",
    "cryptography>=43.0.0",
    "websockets>=11.0.3",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "cryptonite-schemas",
    "cryptonite-storage",
    "cryptonite-strategies",
]

[tool.hatch.build.targets.wheel]
packages = ["cryptonite_execution"]
