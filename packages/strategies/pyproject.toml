[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptonite-strategies"
version = "0.1.0"
description = "Canonical NautilusTrader strategy registry and implementations for Cryptonite"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.9.0",
    "nautilus-trader==2.0.0rc4",
    "cryptonite-schemas",
]

[tool.hatch.build.targets.wheel]
packages = ["cryptonite_strategies"]
