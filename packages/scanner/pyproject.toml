[project]
name = "cryptonite-scanner"
version = "0.1.0"
description = "Vectorized Polars technical indicator and scanner rule evaluation engine"
requires-python = ">=3.12,<3.15"
dependencies = [
    "polars>=1.12.0",
    "duckdb>=1.1.0",
    "pydantic>=2.9.0",
    "cryptonite-schemas",
    "cryptonite-storage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = ["cryptonite_scanner/data/preset_replay.json"]
