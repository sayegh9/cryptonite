name: CI

# C1 (F-H4): the checks a PR must pass before it can merge. security.yml (TruffleHog) runs separately.
# Required checks (branch protection): ruff, web, pytest, e2e-smoke.

on:
  push:
    branches: ["main", "review-plan"]
  pull_request:

# Only a superseded PR run is cancelled; every push to main / review-plan keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUFF_VERSION: "0.16.6"   # matches uv.lock
  UV_VERSION: "0.12.17"    # matches infra/docker/*.Dockerfile
  NODE_VERSION: "22"

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # diff against the PR base / the previous push

      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no floating major tag
        with:
          version: ${{ env.UV_VERSION }}

      # Blocking: every Python file this change adds or modifies must be clean.
      - name: Ruff on changed Python files
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git rev-parse HEAD^1)"  # checkout is the test merge commit; parent 1 is the target branch
          else
            base="$PUSH_BEFORE"
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD~1)"  # new branch or force push: check the last commit only
            fi
          fi
          # Assigned, not process-substituted, so a git error fails the step instead of passing it.
          changed="$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.py')"
          if [ -z "$changed" ]; then
            echo "No changed Python files."
            exit 0
          fi
          mapfile -t files <<< "$changed"
          printf 'Checking %s changed file(s):\n' "${#files[@]}"; printf '  %s\n' "${files[@]}"
          uvx "ruff@${RUFF_VERSION}" check --output-format=github "${files[@]}"

      # Informational until C2 clears the existing findings; never fails the job.
      - name: Ruff on the whole tree (informational)
        run: |
          {
            echo "### Ruff, whole tree (informational until C2)"
            echo '```'
            uvx "ruff@${RUFF_VERSION}" check . --statistics --exit-zero
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16  # the image the dev stack runs (pg16 tag, digest ccc6e83d)
        env:
          # Same superuser as the compose `postgres` service; a throwaway DB, never the dev DB `cryptonite`.
          POSTGRES_USER: cryptonite
          POSTGRES_PASSWORD: cryptonite_dev_pass
          POSTGRES_DB: cryptonite_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cryptonite -d cryptonite_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Mirrors the compose `test` service, pointed at the service containers above.
      CRYPTONITE_ENV: test
      DATABASE_URL: postgresql://cryptonite:cryptonite_dev_pass@localhost:5432/cryptonite_ci
      ASYNC_DATABASE_URL: postgresql+asyncpg://cryptonite:cryptonite_dev_pass@localhost:5432/cryptonite_ci
      REDIS_URL: redis://localhost:6379/0
      # The redis service container belongs to this job alone: the Nautilus spike tests may use DB 0
      # (tests/connections.py; on the host they skip so the live stack's DB 0 is never touched).
      CRYPTONITE_TEST_REDIS_DEDICATED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python workspace
        run: uv sync --frozen --extra dev --all-packages

      # Roles must exist before the migrations grant to them (docs/runbooks/db_bootstrap.md);
      # init-roles.sh creates them with the dev passwords the role tests log in with.
      - name: Create database roles
        env:
          PGHOST: localhost
          PGPASSWORD: cryptonite_dev_pass
          POSTGRES_USER: cryptonite
          POSTGRES_DB: cryptonite_ci
        run: |
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq postgresql-client; }
          bash infra/docker/init-roles.sh

      - name: Alembic upgrade from empty
        run: uv run python -m alembic -c infra/migrations/alembic.ini upgrade head

      - name: pytest
        run: uv run pytest tests -q -rfE --durations=25 --junitxml=pytest-results.xml

      # Excluded by the default addopts because they downgrade and re-upgrade the schema; safe here
      # because the DB is throwaway. Runs last so the main suite sees an untouched schema.
      - name: pytest (destructive, throwaway DB)
        run: uv run pytest tests -q -rfE -m destructive --junitxml=pytest-destructive.xml

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: pytest-*.xml
          retention-days: 14

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: pw
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          # Browser builds are distro-specific: key on the runner image and arch, not just the OS.
          key: playwright-${{ steps.pw.outputs.image }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build web
        run: pnpm build

      # The spec list in `e2e:smoke` is a set of path filters: a renamed spec would silently drop out.
      # Raise SMOKE_MIN_TESTS when tests are added to the subset.
      - name: Guard the smoke subset size
        env:
          SMOKE_MIN_TESTS: "52"
        run: |
          total="$(pnpm --silent e2e:smoke --list | awk '/^Total: /{print $2}')"
          echo "Smoke subset: ${total:-0} tests (minimum ${SMOKE_MIN_TESTS})"
          [ "${total:-0}" -ge "$SMOKE_MIN_TESTS" ] || { echo "::error::e2e:smoke lists ${total:-0} tests, expected at least ${SMOKE_MIN_TESTS}"; exit 1; }

      # No backend runs here: the subset is pure-module specs plus page specs that use
      # e2e/fixtures/offline.ts (unstubbed API calls get a 503, the :8000 socket is mocked).
      - name: Playwright smoke subset
        run: pnpm e2e:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
