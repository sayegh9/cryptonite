[project]
name = "cryptonite"
version = "0.1.0"
description = "Self-hosted crypto intelligence and algorithmic trading platform"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "nautilus-trader==2.0.0rc4",
    "pyarrow>=18.0.0",
    "duckdb>=1.1.0",
    "polars>=1.12.0",
    "pydantic>=2.9.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "cryptonite-schemas",
    "cryptonite-storage",
    "cryptonite-ingest",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.uv.workspace]
members = [
    "packages/schemas",
    "packages/storage",
    "services/ingest",
]

[tool.uv.sources]
cryptonite-schemas = { workspace = true }
cryptonite-storage = { workspace = true }
cryptonite-ingest = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
