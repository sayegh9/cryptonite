[project]
name = "cryptonite"
version = "0.1.0"
description = "Self-hosted crypto intelligence and algorithmic trading platform"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "nautilus-trader==2.0.0rc4",
    "pyarrow>=18.0.0",
    "duckdb>=1.1.0",
    "polars>=1.12.0",
    "pydantic>=2.9.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "cryptonite-schemas",
    "cryptonite-storage",
    "cryptonite-ingest",
    "cryptonite-scanner",
    "cryptonite-outbox",
    "cryptonite-scanner-service",
    "cryptonite-api",
    "cryptonite-strategies",
    "cryptonite-backtester",
    "cryptonite-backtester-service",
    "cryptonite-execution",
    "cryptonite-executor",
    "cryptonite-orchestrator",
    "cryptonite-agents",
    "redis>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pandas>=3.0.5",
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.uv.workspace]
members = [
    "packages/schemas",
    "packages/storage",
    "packages/scanner",
    "packages/strategies",
    "packages/backtester",
    "packages/execution",
    "packages/agents",
    "services/ingest",
    "services/outbox",
    "services/scanner",
    "services/api",
    "services/backtester",
    "services/executor",
    "services/orchestrator",
]

[tool.uv.sources]
cryptonite-schemas = { workspace = true }
cryptonite-storage = { workspace = true }
cryptonite-ingest = { workspace = true }
cryptonite-scanner = { workspace = true }
cryptonite-outbox = { workspace = true }
cryptonite-scanner-service = { workspace = true }
cryptonite-api = { workspace = true }
cryptonite-strategies = { workspace = true }
cryptonite-backtester = { workspace = true }
cryptonite-backtester-service = { workspace = true }
cryptonite-execution = { workspace = true }
cryptonite-executor = { workspace = true }
cryptonite-orchestrator = { workspace = true }
cryptonite-agents = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-m 'not destructive and not binance_demo and not performance'"
markers = [
    "performance: long-running multi-chunk memory and throughput benchmarks",
    "binance_demo: credentialed live Binance Demo venue integration tests",
    "binance_demo_strict: strict release gate tests for Binance Demo that fail if credentials are missing",
    "destructive: tests that alter or drop database schemas/tables",
    "integration: integration tests requiring external systems or databases",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
